####################################################################################################
# Project-wide parameters
####################################################################################################
FASTQ_DIR: DATA/READS_cDNA
level: orchestrator


# Place module-specific overrides here
slurm:
    scratch: /lscratch/$SLURM_JOB_ID
    gpu_partition: gpu
    norm_partition: norm
    gpu_extra: '--gpus-per-node=a100:1'
cellranger:
    dir: DATA/CELLRANGER
    scratch_gb: 500
    transcriptome: /fdb/cellranger/refdata-gex-GRCh38-2024-A
    create_bam: true                            # true or false - all lowercase required
    module: 'cellranger/10.1.0'
    script: 'scripts/cellranger.sh'
cellbender:
    dir: DATA/CELLBENDER
    scratch_gb: 500
    module: 'cellbender/0.3.2'
    script: 'scripts/cellbender.sh'
